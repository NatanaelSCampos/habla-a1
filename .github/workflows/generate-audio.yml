name: Gerar áudio em espanhol

on:
  workflow_dispatch:
    inputs:
      max_clips:
        description: 'Quantidade de novos áudios nesta execução'
        required: true
        default: '450'
        type: choice
        options:
          - '20'
          - '80'
          - '200'
          - '450'
  push:
    branches: [main]
    paths:
      - 'audio/sources.json'
      - 'tools/generate_audio.py'
      - '.github/workflows/generate-audio.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: habla-a1-audio-generation
  cancel-in-progress: false

jobs:
  synthesize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar sintetizador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "kokoro==0.9.4" soundfile
      - name: Gerar arquivos MP3
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          LIMIT: ${{ inputs.max_clips || '450' }}
        run: |
          python tools/generate_audio.py --max-new "$LIMIT"
          python tools/generate_audio.py --validate-only
      - name: Guardar arquivos para recuperação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-gerado-${{ github.run_id }}
          path: |
            audio/index.json
            audio/clips/*.mp3
            audio/last-errors.json
          retention-days: 7
      - name: Publicar áudio gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/index.json audio/clips
          if git diff --cached --quiet; then
            echo "Nenhum MP3 novo para publicar."
          else
            git commit -m "audio: adicionar voz neural em espanhol"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Conflito no catálogo. Os MP3 estão no artefato desta execução; nenhuma alteração remota foi sobrescrita." >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Áudios publicados com sucesso."
                exit 0
              fi
              echo "A branch mudou durante a publicação. Tentativa $attempt de 3."
              sleep 3
            done
            echo "Não foi possível publicar os arquivos após três tentativas." >&2
            exit 1
          fi

      - name: Atualizar áudio no site
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -f -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
