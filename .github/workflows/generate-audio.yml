name: Gerar áudio em espanhol

on:
  workflow_dispatch:
    inputs:
      max_clips:
        description: 'Quantidade de novos áudios nesta execução'
        required: true
        default: '80'
        type: choice
        options:
          - '20'
          - '80'
          - '200'
          - '450'
  push:
    paths:
      - 'audio/sources.json'
      - 'tools/generate_audio.py'
      - '.github/workflows/generate-audio.yml'

permissions:
  contents: write

concurrency:
  group: habla-a1-audio-generation
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Preparar sintetizador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "kokoro==0.9.4" soundfile
      - name: Gerar arquivos MP3
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          LIMIT: ${{ inputs.max_clips || '80' }}
        run: |
          python tools/generate_audio.py --max-new "$LIMIT"
      - name: Publicar áudio gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/index.json audio/clips
          if git diff --cached --quiet; then
            echo "Nenhum MP3 novo para publicar."
          else
            git commit -m "audio: adicionar voz neural em espanhol"
            git push
          fi
