name: Gerar áudio em espanhol com Azure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-audio.yml'
  workflow_dispatch:
    inputs:
      max_clips:
        description: 'Máximo de novas frases; 6000 cobre o banco atual'
        required: true
        default: '6000'
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: habla-a1-audio-generation
  cancel-in-progress: false

jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir autenticação e voz mexicana sem gerar áudio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_ENDPOINT: ${{ secrets.AZURE_SPEECH_ENDPOINT }}
        run: node tools/generate-azure-audio.cjs --check-access

  synthesize:
    needs: verify-access
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: main
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Preparar sintetizador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci
          node tools/collect-audio-sources.cjs --check
      - name: Gerar arquivos MP3
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_ENDPOINT: ${{ secrets.AZURE_SPEECH_ENDPOINT }}
          LIMIT: ${{ inputs.max_clips }}
          FFMPEG_PATH: /usr/bin/ffmpeg
        run: |
          node tools/generate-azure-audio.cjs --max-new "$LIMIT"
      - name: Validar áudios e ativar catálogo completo
        run: |
          npx playwright install --with-deps chromium
          node tools/verify-audio.cjs --pending
          node tools/generate-azure-audio.cjs --activate
          node tools/check-site.cjs
      - name: Guardar arquivos para recuperação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-gerado-${{ github.run_id }}
          path: |
            audio/index.json
            audio/azure-index.pending.json
            audio/clips/*.mp3
            audio/last-errors.json
            test-results/audio-verification.json
          retention-days: 7
      - name: Publicar áudio gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/index.json audio/clips
          if git diff --cached --quiet; then
            echo "Nenhum MP3 novo para publicar."
          else
            git commit -m "audio: adicionar voz mexicana do Azure Speech"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Conflito no catálogo. Os MP3 estão no artefato desta execução; nenhuma alteração remota foi sobrescrita." >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Áudios publicados com sucesso."
                exit 0
              fi
              echo "A branch mudou durante a publicação. Tentativa $attempt de 3."
              sleep 3
            done
            echo "Não foi possível publicar os arquivos após três tentativas." >&2
            exit 1
          fi

      - name: Atualizar áudio no site
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -f -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
