name: Verificar aplicativo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check:site
      - run: node tools/collect-audio-sources.cjs --check
      - run: npm run format:check
      - run: npm test
      - run: python tests/test_generate_audio.py -v
      - run: python tools/generate_audio.py --validate-only

  browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSERS: chromium-desktop,chromium-mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-do-navegador
          path: test-results/
          retention-days: 7
