<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f9f9" />
    <meta
      name="description"
      content="Habla — painel de apoio e prática de conversação em espanhol com repetição espaçada, estruturas e treino de fala."
    />
    <title>Habla · Seu apoio para falar espanhol</title>
    <link rel="stylesheet" href="./assets/css/app.css" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Habla A1" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./study-lab.css" />
    <link rel="stylesheet" href="./doubts.css" />
    <link rel="stylesheet" href="./coach.css" />
    <link rel="stylesheet" href="./quick-doubt.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Ir para o conteúdo</a>
    <noscript
      ><p class="noscript-message">
        Ative o JavaScript no navegador para abrir seus estudos no Habla. Seus dados salvos
        continuam neste aparelho.
      </p></noscript
    >
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">h.</div>
          <div><strong>habla</strong><span>ESPAÑOL · A1</span></div>
        </div>
        <div>
          <div class="nav-label">Seu espaço</div>
          <nav class="nav" id="sidebarNav" aria-label="Navegação principal"></nav>
        </div>
        <div class="sidebar-bottom" id="sidebarBottom"></div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="crumb" id="breadcrumb">Habla / Início</div>
          <div class="topbar-actions">
            <button
              class="header-help"
              data-act="guide-replay"
              title="Ver apresentação inicial novamente"
              aria-label="Ver apresentação inicial novamente"
            >
              ? <span>Como usar</span></button
            ><span class="pill"><span class="pill-dot"></span> Seu progresso está salvo</span
            ><button
              class="icon-btn"
              data-act="theme"
              aria-label="Alternar tema"
              title="Alternar tema"
              id="themeBtn"
            ></button>
          </div>
        </header>
        <main class="main" id="app" aria-live="polite" tabindex="-1"></main>
      </div>
    </div>
    <nav class="mobile-nav" id="mobileNav" aria-label="Navegação no celular"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div id="guideRoot"></div>
    <div id="moreRoot"></div>
    <div id="audioStatus" role="status" aria-live="polite" hidden class="audio-status"></div>
    <button
      id="doubtFab"
      type="button"
      class="dq-fab"
      data-act="dq-open"
      aria-label="Anotar dúvida em qualquer tela"
      aria-haspopup="dialog"
      aria-expanded="false"
      title="Anotar dúvida sem sair da tela"
    >
      <span aria-hidden="true">✎</span><span class="dq-fab-label">Anotar dúvida</span
      ><span class="dq-count" id="doubtFabCount" hidden></span>
    </button>
    <div id="doubtQuickRoot"></div>
    <input type="file" accept="application/json,.json" id="importFile" hidden />
    <script src="./assets/js/content.js" defer></script>
    <script src="./assets/js/verbs.js" defer></script>
    <script src="./assets/js/workbook.js" defer></script>
    <script src="./audio-player.js" defer></script>
    <script src="./assets/js/app.js" defer></script>
    <script src="./study-lab.js" defer></script>
    <script src="./doubts.js" defer></script>
    <script src="./coach.js" defer></script>
    <script src="./quick-doubt.js" defer></script>
  </body>
</html>
