<script>
// Banco de estruturas: espanhol latino-americano amplo (tú / ustedes, sem voseo).
const STRUCTURES = [];
const GROUPS = [];
function group(name, level, entries) {
  GROUPS.push(name);
  entries.forEach((e, n) => {
    const [title, formula, purpose, tip, pairs, optionalLevel] = e;
    const examples = pairs.split(';;').map((piece,i) => {
      const [es, pt] = piece.split('::').map(s=>s.trim());
      if (!es || !pt) throw new Error('Par inválido: '+title+' '+i);
      return {es,pt,id:`g${GROUPS.length-1}p${n}e${i}`};
    });
    STRUCTURES.push({id:`g${GROUPS.length-1}p${n}`, category:name, level: optionalLevel || level, title, formula, purpose, tip, examples});
  });
}

group('Começar a aula','A1',[
['Saudações','¡Buenos días! / ¡Buenas tardes!','Cumprimentar conforme o horário.','Buenos días = manhã; buenas tardes = tarde; buenas noches = noite.','¡Buenos días, Víctor!::Bom dia, Victor!;;¡Buenas tardes, Víctor!::Boa tarde, Victor!;;¡Buenas noches a todos!::Boa noite a todos!'],
['Como você está?','¿Cómo estás?','Perguntar como alguém está.','Em perguntas, use ¿ no começo.','¿Cómo estás, Víctor?::Como você está, Victor?;;Hola, ¿cómo estás?::Olá, como você está?;;¿Cómo estás hoy?::Como você está hoje?'],
['Está tudo bem?','¿Todo bien?','Cumprimento curto, bem natural.','Entonação faz a pergunta.','¿Todo bien?::Tudo bem?;;Hola, ¿todo bien?::Olá, tudo bem?;;¿Todo bien con la conexión?::Tudo certo com a conexão?'],
['Estou bem','Estoy + adjetivo','Dizer como você se sente.','Ser = característica; estar = estado/condição.','Estoy bien, gracias.::Estou bem, obrigado.;;Estoy un poco cansado.::Estou um pouco cansado.;;Estoy muy contento hoy.::Estou muito feliz hoje.'],
['E você?','¿Y tú?','Devolver uma pergunta ao professor.','Tú com acento é pronome; tu sem acento indica posse.','Estoy bien, ¿y tú?::Estou bem, e você?;;Muy bien, ¿y tú?::Muito bem, e você?;;Mi día fue tranquilo, ¿y el tuyo?::Meu dia foi tranquilo, e o seu?'],
['Como vai o seu dia?','¿Qué tal tu día?','Puxar assunto rapidamente.','Qué leva acento em perguntas.','¿Qué tal tu día?::Como está sendo seu dia?;;¿Qué tal tu semana?::Como está sendo sua semana?;;¿Qué tal el trabajo?::Como vai o trabalho?'],
['Pronto para começar','Estoy listo para + infinitivo','Sinalizar que pode iniciar.','Use listo se você se identifica no masculino; lista no feminino.','Estoy listo para empezar.::Estou pronto para começar.;;Estoy listo para practicar.::Estou pronto para praticar.;;Estoy listo para la clase.::Estou pronto para a aula.'],
['O que estudaremos?','¿Qué vamos a + infinitivo?','Perguntar o plano da aula.','Vamos a indica futuro próximo.','¿Qué vamos a estudiar hoy?::O que vamos estudar hoje?;;¿Qué vamos a practicar?::O que vamos praticar?;;¿Qué vamos a hacer ahora?::O que vamos fazer agora?'],
['Começar agora','Podemos + infinitivo','Propor começar ou fazer algo.','Depois de podemos, o verbo fica no infinitivo.','Podemos empezar.::Podemos começar.;;Podemos continuar.::Podemos continuar.;;Podemos practicar la conversación.::Podemos praticar a conversação.'],
['Como foi o fim de semana?','¿Cómo estuvo + ...?','Conversar sobre o fim de semana.','Estuvo é passado; memorize a expressão como bloco.','¿Cómo estuvo tu fin de semana?::Como foi seu fim de semana?;;¿Cómo estuvo tu día?::Como foi seu dia?;;¿Cómo estuvo la clase?::Como foi a aula?','A1+'],
['Um pouco cansado','Estoy un poco + adjetivo','Descrever seu estado sem elaborar muito.','Un poco de + substantivo; un poco + adjetivo.','Estoy un poco cansado.::Estou um pouco cansado.;;Estoy un poco nervioso.::Estou um pouco nervoso.;;Estoy un poco ocupado.::Estou um pouco ocupado.'],
['Encerramento','Nos vemos + tiempo','Terminar a aula com naturalidade.','Nos vemos = a gente se vê.','¡Nos vemos mañana!::Até amanhã!;;¡Nos vemos en la próxima clase!::Até a próxima aula!;;¡Gracias por la clase!::Obrigado pela aula!']
]);

group('Quando eu travar','A1',[
['Peça para repetir','¿Puedes repetir + ...?','Pedir uma repetição.','Puedes é a forma de poder para tú.','¿Puedes repetir, por favor?::Pode repetir, por favor?;;¿Puedes repetir la pregunta?::Pode repetir a pergunta?;;¿Puedes repetir la última palabra?::Pode repetir a última palavra?'],
['Fale mais devagar','¿Puedes hablar + ...?','Controlar a velocidade da aula.','Más = mais; despacio = devagar.','¿Puedes hablar más despacio?::Pode falar mais devagar?;;¿Puedes hablar un poco más lento?::Pode falar um pouco mais devagar?;;¿Puedes hablar más alto?::Pode falar mais alto?'],
['Não entendi','No entiendo / No entendí','Dizer que não compreendeu.','No entiendo = não entendo; no entendí = não entendi o que acabou de ser dito.','No entiendo esta palabra.::Não entendo esta palavra.;;No entendí la pregunta.::Não entendi a pergunta.;;No entendí la última parte.::Não entendi a última parte.'],
['O que significa?','¿Qué significa + ...?','Perguntar o significado de uma palavra.','Significa funciona com sujeito singular.','¿Qué significa esta palabra?::O que significa esta palavra?;;¿Qué significa «trabajar»?::O que significa «trabajar»?;;¿Qué significa eso?::O que isso significa?'],
['Como se diz?','¿Cómo se dice + ...?','Perguntar a tradução de uma palavra.','Aprenda como expressão pronta: cómo se dice.','¿Cómo se dice «suporte» en español?::Como se diz «suporte» em espanhol?;;¿Cómo se dice esto?::Como se diz isto?;;¿Cómo se dice esta palabra en español?::Como se diz esta palavra em espanhol?'],
['Como se pronuncia?','¿Cómo se pronuncia + ...?','Perguntar a pronúncia.','Pronuncia se escreve sem acento neste verbo.','¿Cómo se pronuncia esta palabra?::Como se pronuncia esta palavra?;;¿Cómo se pronuncia «desarrollador»?::Como se pronuncia «desarrollador»?;;¿Cómo se pronuncia la letra jota?::Como se pronuncia a letra jota?'],
['Pode escrever?','¿Puedes escribir + ...?','Pedir apoio visual no chat.','Escribir = escrever.','¿Puedes escribirlo en el chat?::Pode escrever isso no chat?;;¿Puedes escribir la frase?::Pode escrever a frase?;;¿Puedes escribir un ejemplo?::Pode escrever um exemplo?'],
['Um momento','Dame un momento para + infinitivo','Ganhar tempo para formular a resposta.','Muito útil: não fique em silêncio ao travar.','Dame un momento para pensar.::Me dá um momento para pensar.;;Dame un momento para responder.::Me dá um momento para responder.;;Dame un momento para recordar.::Me dá um momento para lembrar.'],
['Não sei como dizer','No sé cómo + infinitivo','Explicar uma dificuldade de expressão.','Sé leva acento no verbo saber.','No sé cómo decirlo en español.::Não sei como dizer isso em espanhol.;;No sé cómo explicar esto.::Não sei como explicar isto.;;No sé cómo empezar.::Não sei como começar.'],
['Não lembro','No recuerdo + ...','Quando conhece a palavra, mas esqueceu.','Recuerdo é verbo recordar no presente.','No recuerdo la palabra.::Não me lembro da palavra.;;No recuerdo el verbo.::Não me lembro do verbo.;;No recuerdo cómo se dice.::Não lembro como se diz.'],
['Quero dizer que...','Quiero decir que + frase','Reformular depois de um erro.','Uma ponte para continuar falando.','Quiero decir que trabajo desde casa.::Quero dizer que trabalho de casa.;;Quiero decir que tengo una duda.::Quero dizer que tenho uma dúvida.;;Quiero decir que hoy estoy cansado.::Quero dizer que hoje estou cansado.'],
['É difícil para mim','Es difícil para mí + infinitivo','Explicar por que precisa de tempo.','Mí leva acento depois de preposição.','Es difícil para mí hablar rápido.::É difícil para mim falar rápido.;;Es difícil para mí recordar las palabras.::É difícil para mim lembrar as palavras.;;Es difícil para mí explicarlo.::É difícil para mim explicar isso.'],
['Pode dar exemplo?','¿Puedes darme + ...?','Pedir uma demonstração.','Darme = dar para mim.','¿Puedes darme un ejemplo?::Pode me dar um exemplo?;;¿Puedes darme otra frase?::Pode me dar outra frase?;;¿Puedes darme una pista?::Pode me dar uma dica?'],
['Minha resposta está certa?','¿Está bien + ...?','Confirmar uma tentativa.','Está correto? = ¿Está correcto?; ¿Está bien? é muito natural.','¿Está bien mi respuesta?::Minha resposta está certa?;;¿Está bien así?::Está certo assim?;;¿Está bien esta frase?::Esta frase está certa?'],
['Corrija por favor','¿Puedes corregir + ...?','Pedir feedback específico.','Corregir = corrigir.','¿Puedes corregir mi pronunciación?::Pode corrigir minha pronúncia?;;¿Puedes corregir esta frase?::Pode corrigir esta frase?;;¿Puedes corregirme, por favor?::Pode me corrigir, por favor?'],
['Quero tentar outra vez','Quiero intentarlo + ...','Tentar sem medo de errar.','Intentarlo = tentar isso.','Quiero intentarlo otra vez.::Quero tentar outra vez.;;Quiero intentarlo sin ayuda.::Quero tentar sem ajuda.;;Quiero intentarlo en español.::Quero tentar em espanhol.'],
['Mais fácil, por favor','¿Puedes usar + ...?','Pedir uma versão mais simples.','Usar palabras más simples é uma ótima estratégia A1.','¿Puedes usar palabras más simples?::Pode usar palavras mais simples?;;¿Puedes hacer una pregunta más fácil?::Pode fazer uma pergunta mais fácil?;;¿Puedes explicar de otra forma?::Pode explicar de outra forma?']
]);

group('Me apresentar','A1',[
['Meu nome','Me llamo + nombre','Dizer o nome.','ll costuma soar como y em espanhol latino-americano padrão.','Me llamo Natanael.::Eu me chamo Natanael.;;Me llamo Ana.::Eu me chamo Ana.;;Hola, me llamo Carlos.::Olá, eu me chamo Carlos.'],
['Meu nome é','Mi nombre es + nombre','Outra maneira de se apresentar.','Mi = meu/minha; me = me.','Mi nombre es Natanael.::Meu nome é Natanael.;;Mi nombre es Lucía.::Meu nome é Lucía.;;Hola, mi nombre es Daniel.::Olá, meu nome é Daniel.'],
['Eu sou','Soy + profesión / nacionalidad','Falar sobre identidade e profissão.','Não use estoy para profissão habitual.','Soy desarrollador web.::Sou desenvolvedor web.;;Soy brasileño.::Sou brasileiro.;;Soy estudiante de español.::Sou estudante de espanhol.'],
['Você é','Eres + ...','Perguntar ou afirmar sobre outra pessoa.','Com tú, ser vira eres.','¿Eres profesor?::Você é professor?;;Eres muy amable.::Você é muito gentil.;;¿Eres de Brasil?::Você é do Brasil?'],
['Sou de','Soy de + lugar','Dizer origem.','Soy de = sou de; vivo en = moro em.','Soy de Brasil.::Sou do Brasil.;;Soy de Itanhém.::Sou de Itanhém.;;Soy de una ciudad pequeña.::Sou de uma cidade pequena.'],
['Moro em','Vivo en + lugar','Dizer onde mora.','En = em.','Vivo en São Paulo.::Moro em São Paulo.;;Vivo en Brasil.::Moro no Brasil.;;Vivo en una ciudad grande.::Moro em uma cidade grande.'],
['Tenho X anos','Tengo + número + años','Informar a idade.','Em espanhol, idade é tener, nunca ser.','Tengo treinta y cuatro años.::Tenho trinta e quatro anos.;;Tengo treinta años.::Tenho trinta anos.;;Tengo veinte años.::Tenho vinte anos.'],
['Trabalho em','Trabajo en + lugar / sector','Dizer em que área trabalha.','Trabajo no presente é eu trabalho.','Trabajo en tecnología.::Trabalho com tecnologia.;;Trabajo en el sector de soporte.::Trabalho no setor de suporte.;;Trabajo en una empresa de software.::Trabalho em uma empresa de software.'],
['Trabalho com','Trabajo con + ...','Falar sobre ferramentas ou pessoas.','Con = com.','Trabajo con sitios web.::Trabalho com sites.;;Trabajo con tiendas en línea.::Trabalho com lojas virtuais.;;Trabajo con un equipo de tecnología.::Trabalho com uma equipe de tecnologia.'],
['Trabalho de casa','Trabajo desde + lugar','Dizer de onde você trabalha.','Desde casa = de casa / em home office.','Trabajo desde casa.::Trabalho de casa.;;Trabajo desde mi oficina.::Trabalho do meu escritório.;;Trabajo desde São Paulo.::Trabalho de São Paulo.'],
['Eu falo','Hablo + idioma','Dizer quais idiomas fala.','Hablo = eu falo; hablas = você fala.','Hablo portugués.::Falo português.;;Hablo un poco de español.::Falo um pouco de espanhol.;;Hablo portugués y estudio español.::Falo português e estudo espanhol.'],
['Eu estudo','Estudio + ...','Falar sobre estudos.','Estudio é forma verbal, não substantivo.','Estudio español.::Estudo espanhol.;;Estudio por la noche.::Estudo à noite.;;Estudio con un profesor.::Estudo com um professor.'],
['Este é / Esta é','Este es / Esta es + ...','Apresentar alguém ou algo.','Este = masculino; esta = feminino.','Este es mi profesor.::Este é meu professor.;;Esta es mi computadora.::Este é meu computador.;;Este es mi trabajo.::Este é meu trabalho.'],
['Meu / minha','Mi + sustantivo','Falar de posse.','Mi vale para masculino e feminino singular.','Mi profesor se llama Víctor.::Meu professor se chama Victor.;;Mi computadora es nueva.::Meu computador é novo.;;Mi trabajo es interesante.::Meu trabalho é interessante.'],
['Nosso / nossa','Nuestro / nuestra + sustantivo','Falar de algo do grupo.','Concorda com gênero e número.','Nuestro equipo es pequeño.::Nossa equipe é pequena.;;Nuestra clase empieza ahora.::Nossa aula começa agora.;;Nuestro proyecto es nuevo.::Nosso projeto é novo.'],
['Contato','Mi correo es / Mi número es','Informar e-mail e telefone.','Arroba = @; punto = ponto.','Mi correo es ana arroba ejemplo punto com.::Meu e-mail é ana arroba exemplo ponto com.;;Mi número es once, nueve, ocho.::Meu número é onze, nove, oito.;;¿Cuál es tu correo electrónico?::Qual é seu e-mail?']
]);

group('Estruturas essenciais','A1',[
['Eu quero','Quiero + infinitivo','Expressar intenção ou desejo.','Depois de quiero, o segundo verbo fica no infinitivo.','Quiero aprender español.::Quero aprender espanhol.;;Quiero practicar más.::Quero praticar mais.;;Quiero hacer una pregunta.::Quero fazer uma pergunta.'],
['Eu preciso','Necesito + sustantivo / infinitivo','Falar de uma necessidade.','Necesito ayuda = preciso de ajuda.','Necesito estudiar más.::Preciso estudar mais.;;Necesito ayuda.::Preciso de ajuda.;;Necesito practicar la pronunciación.::Preciso praticar a pronúncia.'],
['Eu posso','Puedo + infinitivo','Dizer o que consegue fazer.','Puedo é irregular; o infinitivo seguinte não se conjuga.','Puedo hablar un poco de español.::Consigo falar um pouco de espanhol.;;Puedo responder ahora.::Posso responder agora.;;Puedo estudiar por la noche.::Posso estudar à noite.'],
['Não consigo','No puedo + infinitivo','Expressar uma dificuldade.','No fica antes do verbo.','No puedo recordar la palabra.::Não consigo lembrar a palavra.;;No puedo hablar muy rápido.::Não consigo falar muito rápido.;;No puedo escuchar el audio.::Não consigo ouvir o áudio.'],
['Tenho que','Tengo que + infinitivo','Expressar obrigação.','Não confundir tengo que com quiero.','Tengo que trabajar hoy.::Tenho que trabalhar hoje.;;Tengo que estudiar español.::Tenho que estudar espanhol.;;Tengo que salir ahora.::Tenho que sair agora.'],
['Vou fazer','Voy a + infinitivo','Futuro próximo.','Voy a estudiar = vou estudar.','Voy a estudiar esta noche.::Vou estudar hoje à noite.;;Voy a practicar después de la clase.::Vou praticar depois da aula.;;Voy a hacer una pregunta.::Vou fazer uma pergunta.'],
['Eu gosto','Me gusta + sustantivo singular / infinitivo','Falar de gostos.','Com plural, normalmente me gustan.','Me gusta el fútbol.::Gosto de futebol.;;Me gusta estudiar idiomas.::Gosto de estudar idiomas.;;Me gusta esta clase.::Gosto desta aula.'],
['Eu gosto de coisas (plural)','Me gustan + sustantivo plural','Dizer que gosta de várias coisas.','Gustan concorda com o que agrada.','Me gustan los videojuegos.::Gosto de videogames.;;Me gustan las películas.::Gosto de filmes.;;Me gustan los idiomas.::Gosto de idiomas.'],
['Eu não gosto','No me gusta + ...','Dizer de que não gosta.','Coloque no antes de me gusta.','No me gusta llegar tarde.::Não gosto de chegar atrasado.;;No me gusta el ruido.::Não gosto de barulho.;;No me gusta estudiar con prisa.::Não gosto de estudar com pressa.'],
['Eu prefiro','Prefiero + sustantivo / infinitivo','Falar de preferências.','Prefiero = eu prefiro.','Prefiero estudiar por la mañana.::Prefiro estudar de manhã.;;Prefiero hablar en español.::Prefiro falar em espanhol.;;Prefiero una explicación sencilla.::Prefiro uma explicação simples.'],
['Eu acho que','Creo que + oración','Expressar opinião sem afirmar certeza.','Creo que é uma frase muito reutilizável.','Creo que entiendo.::Acho que entendo.;;Creo que es correcto.::Acho que está correto.;;Creo que necesito practicar más.::Acho que preciso praticar mais.'],
['Eu penso que','Pienso que + oración','Expressar uma opinião.','Pienso que se aproxima de acho que.','Pienso que es interesante.::Acho que é interessante.;;Pienso que la clase ayuda mucho.::Acho que a aula ajuda muito.;;Pienso que podemos empezar.::Acho que podemos começar.'],
['Para mim','Para mí, + oración','Dar uma perspectiva pessoal.','Mí com acento porque vem depois de preposição.','Para mí, es difícil.::Para mim, é difícil.;;Para mí, es importante practicar.::Para mim, é importante praticar.;;Para mí, esta palabra es nueva.::Para mim, esta palavra é nova.'],
['Eu sei','Sé + ...','Dizer o que sabe.','Sé = eu sei; se sem acento é outra palavra.','Sé la respuesta.::Sei a resposta.;;Sé un poco de español.::Sei um pouco de espanhol.;;No sé la respuesta.::Não sei a resposta.'],
['Eu conheço','Conozco + ...','Falar sobre familiaridade.','Saber = saber informação; conocer = conhecer alguém/algum lugar.','Conozco esa palabra.::Conheço essa palavra.;;Conozco São Paulo.::Conheço São Paulo.;;No conozco ese lugar.::Não conheço esse lugar.'],
['Eu faço','Hago + ...','Dizer que realiza uma ação.','Hago é irregular na primeira pessoa.','Hago ejercicio.::Faço exercícios.;;Hago preguntas durante la clase.::Faço perguntas durante a aula.;;Hago una pausa para estudiar.::Faço uma pausa para estudar.'],
['Eu tenho','Tengo + ...','Expressar posse e algumas sensações.','Tenho fome = tengo hambre, não estoy hambre.','Tengo una pregunta.::Tenho uma pergunta.;;Tengo hambre.::Estou com fome.;;Tengo tiempo para estudiar.::Tenho tempo para estudar.'],

 for(const vv of VERB_BANK.verbs){if(vv.lemma!==q.lemma&&vv.unit<=v.unit){const s=vv.es_forms[q.pi];if(s!==q.form&&!distractors.includes(s))distractors.push(s);}}
 for(let i=distractors.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[distractors[i],distractors[j]]=[distractors[j],distractors[i]];}
 const options=[q.form,...distractors.slice(0,3)];for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}return options;
}

const BOOK_UNITS=BOOK_DATA.units, BOOK_EX=BOOK_DATA.exercises;
const WB_TYPE={choice:'Escolha única',fill:'Complete a frase',match:'Associação',tf:'Verdadeiro ou falso',audio:'Escuta adaptada',free:'Produção escrita',multi:'Seleção múltipla',order:'Ordene as palavras'};
const WB_PT={choice:'Leia a pergunta em espanhol e escolha uma alternativa.',fill:'Complete a lacuna usando a palavra ou conjugação correta.',match:'Associe cada expressão à opção correspondente.',tf:'Leia a frase e selecione verdadeiro ou falso.',audio:'Ouça o texto adaptado e responda à pergunta. Este áudio não é o da editora.',free:'Escreva livremente em espanhol e compare com o modelo depois. Não existe apenas uma resposta correta.',multi:'Selecione todas as alternativas corretas.',order:'Organize as palavras para formar uma frase em espanhol.'};
const WB_BASE=()=>({answers:{},results:{},review:{},notes:{},last:'u1-1'});
let wb=loadWB();
function loadWB(){try{const v=JSON.parse(localStorage.getItem(VERB_BOOK_KEY));return v&&typeof v==='object'?Object.assign(WB_BASE(),v,{answers:v.answers||{},results:v.results||{},review:v.review||{},notes:v.notes||{}}):WB_BASE();}catch(e){return WB_BASE();}}
function wbSave(){try{localStorage.setItem(VERB_BOOK_KEY,JSON.stringify(wb));}catch(e){toast('Não foi possível salvar o caderno; exporte um backup.');}}
function wbEx(id){return BOOK_EX.find(x=>x.id===id);}
function wbUnit(n){return BOOK_UNITS.find(x=>x.id===Number(n));}
function wbDone(ex){return Boolean(wb.results[ex.id]);}
function wbUnitCount(n){return BOOK_EX.filter(x=>x.unit===Number(n)&&wbDone(x)).length;}
function wbCurrent(){return wbEx(ui.wbExercise);}
function wbOpenUnit(u){ui.wbUnit=Number(u);ui.wbExercise=null;ui.wbQuery='';ui.wbFilter='all';render();window.scrollTo(0,0);}
function wbOpenExercise(id){const e=wbEx(id);if(!e)return;ui.wbUnit=e.unit;ui.wbExercise=e.id;wb.last=e.id;wbSave();render();window.scrollTo(0,0);}
function wbOptions(items,key){return [...items].sort((a,b)=>wbHash(key+'|'+a)-wbHash(key+'|'+b));}
function wbHash(v){let h=2166136261;for(const c of String(v))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
function wbAnswered(ex){const a=wb.answers[ex.id]||[];return a.some(v=>Array.isArray(v)?v.length:String(v??'').trim());}
function wbAnswerSave(el){const eid=el.dataset.wbId,index=Number(el.dataset.wbIndex),ex=wbEx(eid);if(!ex)return;wb.answers[eid]=wb.answers[eid]||[];let val=el.value;if(ex.kind==='multi'){const v=Array.isArray(wb.answers[eid][index])?[...wb.answers[eid][index]]:[];wb.answers[eid][index]=el.checked?Array.from(new Set([...v,val])):v.filter(x=>x!==val);}else wb.answers[eid][index]=val;wbSave();}
function wbCorrect(ex,q,val){if(ex.kind==='free')return null;if(ex.kind==='multi'){const v=Array.isArray(val)?val:[];return v.length===q.answers.length&&v.every(x=>q.answers.includes(x));}if(['fill','order'].includes(ex.kind))return norm(val)===norm(q.answer);return val===q.answer;}
function wbGrade(){const ex=wbCurrent();if(!ex)return;const ans=wb.answers[ex.id]||[];let total=0,score=0;ex.items.forEach((q,i)=>{const ok=wbCorrect(ex,q,ans[i]);if(ok!==null){total++;if(ok)score++;}});
wb.results[ex.id]={score,total,when:today()};wbSave();data.workbookActivity=data.workbookActivity||{};const a=data.workbookActivity[today()]||{attempts:0,good:0};a.attempts++;if(score===total)a.good++;data.workbookActivity[today()]=a;save();render();const f=document.getElementById('wbResult');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'});}
function wbSetWord(btn){const input=document.querySelector(`[data-wb-id="${CSS.escape(btn.dataset.wbId)}"][data-wb-index="${btn.dataset.wbIndex}"]`);if(!input)return;input.value=(input.value+' '+btn.dataset.word).trim();wbAnswerSave(input);input.focus();}
function wbFeedback(ex,q,i){if(!wb.results[ex.id])return '';const v=(wb.answers[ex.id]||[])[i],ok=wbCorrect(ex,q,v);const answer=ex.kind==='multi'?q.answers.join(', '):q.answer;
return ok===null?`<div class="wb-feedback neutral">Exemplo para comparar: <strong>${escapeHTML(q.model||'')}</strong><p>Esta produção é aberta e não recebe correção automática.</p></div>`:`<div class="wb-feedback ${ok?'correct':'wrong'}">${ok?'✓ Correto':`Resposta esperada: <strong>${escapeHTML(answer)}</strong>`}</div>`;}
function wbInput(ex,q,i){const ans=(wb.answers[ex.id]||[])[i],attr=`data-wb-id="${escapeHTML(ex.id)}" data-wb-index="${i}"`;
if(['choice','audio','tf'].includes(ex.kind)){const options=ex.kind==='tf'?['V','F']:wbOptions(q.options||[],ex.id+':'+i);return `<div class="wb-options">${options.map(x=>`<label class="wb-choice"><input type="radio" name="wb-${ex.id}-${i}" ${attr} value="${escapeHTML(x)}" ${ans===x?'checked':''}><span>${x==='V'?'Verdadeiro':x==='F'?'Falso':escapeHTML(x)}</span></label>`).join('')}</div>`;}
if(ex.kind==='multi'){const a=Array.isArray(ans)?ans:[];return `<div class="wb-options">${wbOptions(q.options||[],ex.id+':'+i).map(x=>`<label class="wb-choice"><input type="checkbox" ${attr} value="${escapeHTML(x)}" ${a.includes(x)?'checked':''}><span>${escapeHTML(x)}</span></label>`).join('')}</div>`;}
if(ex.kind==='match'){const opts=wbOptions(ex.items.map(x=>x.answer),ex.id+':'+i);return `<select class="select wb-select" ${attr}><option value="">Escolha a correspondência…</option>${opts.map(x=>`<option value="${escapeHTML(x)}" ${ans===x?'selected':''}>${escapeHTML(x)}</option>`).join('')}</select>`;}
if(ex.kind==='free')return `<textarea class="wb-textarea" ${attr} placeholder="Sua resposta em espanhol…">${escapeHTML(ans||'')}</textarea>`;
return `${ex.kind==='order'?`<div class="wb-wordbank">${q.prompt.split(' / ').map(word=>`<button class="wb-token" data-act="wb-word" data-wb-id="${escapeHTML(ex.id)}" data-wb-index="${i}" data-word="${escapeHTML(word)}">${escapeHTML(word)}</button>`).join('')}</div>`:''}<input class="wb-input" ${attr} value="${escapeHTML(ans||'')}" placeholder="Escreva sua resposta…" autocomplete="off" spellcheck="false">`;}
function wbExerciseScreen(ex){const unit=wbUnit(ex.unit),arr=BOOK_EX.filter(x=>x.unit===ex.unit),idx=arr.findIndex(x=>x.id===ex.id),done=wb.results[ex.id];return `${heading('CADERNO / UNIDADE '+ex.unit,ex.title,`Exercício ${ex.exercise} · página ${ex.page} · ${unit.title}`)}
<div class="wb-back-row"><button class="btn secondary sm" data-act="wb-unit" data-unit="${ex.unit}">← Voltar à unidade</button><button class="btn secondary sm" data-act="wb-review">${wb.review[ex.id]?'★ Remover da revisão':'☆ Marcar para revisar'}</button></div>
<div class="card wb-sheet"><div class="wb-meta"><span class="chip">${escapeHTML(WB_TYPE[ex.kind])}</span><span class="chip">${ex.items.length} questão(ões)</span><span class="chip">Pág. ${ex.page} · exercício ${ex.exercise}</span></div>
<p class="wb-guide">${escapeHTML(WB_PT[ex.kind])} <button class="inline-translation" data-act="wb-help">${ui.wbHelp?'Ocultar ajuda':'Ver ajuda em português'}</button></p>
${ui.wbHelp?`<div class="wb-help"> <b>Como resolver:</b> ${escapeHTML(WB_PT[ex.kind])}<br><b>O que você vai praticar:</b> ${escapeHTML(ex.title)}.<br><b>Vocabulário:</b> Completa = complete · Relaciona = associe · Escribe = escreva · Elige = escolha · ¿Dónde? = onde · ¿Qué? = o quê.</div>`:''}
${ex.items.map((q,i)=>`<section class="wb-question"><div class="wb-question-number">QUESTÃO ${i+1} / ${ex.items.length}</div>${ex.kind==='audio'?`<div class="wb-audio"><button class="btn secondary sm" data-act="wb-speak" data-index="${i}">▶ Ouvir texto</button><button class="btn secondary sm" data-act="wb-transcript" data-index="${i}">${ui.wbTranscripts[ex.id+'|'+i]?'Ocultar transcrição':'Ver transcrição'}</button></div>${ui.wbTranscripts[ex.id+'|'+i]?`<p class="muted small">${escapeHTML(q.audio)}</p>`:''}`:''}
<div class="wb-question-text" lang="es">${escapeHTML(q.prompt)}</div>${wbInput(ex,q,i)}${wbFeedback(ex,q,i)}</section>`).join('')}
<div class="wb-actions"><button class="btn" data-act="wb-check">${done?'Corrigir novamente':'Conferir respostas'}</button><button class="btn secondary sm" data-act="wb-clear">Limpar</button></div>
${done?`<div class="wb-score" id="wbResult"><strong>${done.total?`Você acertou ${done.score} de ${done.total}`:'Produção escrita registrada'}</strong><div>${done.total?done.score===done.total?'Muito bem! Você pode continuar.':'Compare as respostas e tente de novo.':'Compare seu texto ao exemplo. Esta atividade não tem correção automática.'}</div></div>`:''}</div>
<div class="card wb-notes"><h3>Minhas anotações</h3><textarea id="wbNotes" placeholder="Dúvidas ou palavras novas…">${escapeHTML(wb.notes[ex.id]||'')}</textarea><div class="muted tiny">Salvo automaticamente neste dispositivo.</div></div>
<div class="wb-actions wb-next"><button class="btn secondary" data-act="wb-prev" ${idx===0?'disabled':''}>← Anterior</button><button class="btn" data-act="wb-next" ${idx===arr.length-1?'disabled':''}>Próximo exercício →</button></div>`;}
function wbUnitScreen(){const unit=wbUnit(ui.wbUnit),all=BOOK_EX.filter(x=>x.unit===unit.id),done=all.filter(wbDone).length,groups=new Map();let filtered=all.filter(x=>(ui.wbFilter==='all'||ui.wbFilter==='pending'&&!wbDone(x)||ui.wbFilter==='completed'&&wbDone(x)||ui.wbFilter==='review'&&wb.review[x.id])&&norm(x.title+' '+x.exercise+' '+x.page).includes(norm(ui.wbQuery||'')));
filtered.forEach(x=>{if(!groups.has(x.page))groups.set(x.page,[]);groups.get(x.page).push(x)});
return `${heading('LIVRO DE EXERCÍCIOS · A1','Unidad '+unit.id+' · '+unit.title,unit.subtitle)}
<div class="wb-back-row"><button class="btn secondary sm" data-act="wb-overview">← Todas as unidades</button><span class="chip">${done} / ${all.length} concluídos</span></div><div class="progress-track" style="margin:8px 0 20px"><div class="progress-fill" style="width:${Math.round(done/all.length*100)}%"></div></div>

<div id="wbUnitList" class="wb-page-grid">${wbUnitGroupsHTML(groups)}</div>`;}
function wbUnitGroupsHTML(groups){return [...groups].map(([pg,items])=>`<section class="card wb-group"><div class="wb-group-title">Página ${pg} <span>${items.length} atividades</span></div>${items.map(e=>`<button class="wb-ex-row" data-act="wb-open" data-id="${escapeHTML(e.id)}"><span class="wb-ex-number">${escapeHTML(e.exercise)}</span><span class="wb-ex-details"><strong>${escapeHTML(e.title)}</strong><small>${escapeHTML(WB_TYPE[e.kind])} · ${e.items.length} questão(ões)</small></span><span class="wb-ex-state">${wbDone(e)?'✓':wb.review[e.id]?'★':'›'}</span></button>`).join('')}</section>`).join('')||'<div class="card">Nenhum exercício encontrado neste filtro.</div>';}
function wbOverviewScreen(){let completed=BOOK_EX.filter(wbDone).length;return `${heading('FRECUENCIAS A1','Caderno de exercícios','As 10 unidades do HTML enviado, agora dentro do Habla. Continue pelo capítulo ou retome a última atividade.')}
<div class="wb-note"><strong>Importante:</strong> os 236 exercícios são os do HTML anterior, com a mesma organização e os mesmos dados de resposta. Algumas questões e gravações eram adaptações — não são cópias exatas do PDF original.</div>
<div class="wb-summary"><div><strong>${completed}</strong><span>atividades concluídas</span></div><div><strong>${BOOK_EX.length}</strong><span>atividades disponíveis</span></div><div><strong>${BOOK_EX.filter(x=>wb.review[x.id]).length}</strong><span>marcadas para revisão</span></div></div>
<div class="wb-actions"><button class="btn" data-act="wb-open" data-id="${escapeHTML(wbEx(wb.last)?wb.last:'u1-1')}">Continuar de onde parei →</button></div>
<div class="wb-units">${BOOK_UNITS.map(u=>{const n=wbUnitCount(u.id),pct=Math.round(100*n/u.count);return `<button class="card wb-unit-tile" data-act="wb-unit" data-unit="${u.id}"><span class="wb-unit-number">${String(u.id).padStart(2,'0')}</span><span class="wb-unit-info"><b>${escapeHTML(u.title)}</b><small>${escapeHTML(u.subtitle)}</small><span class="wb-unit-bar"><span style="width:${pct}%"></span></span><span class="wb-unit-stat">${n}/${u.count} concluídos · ${pct}%</span></span><span class="wb-chevron">›</span></button>`}).join('')}</div>`;}
function renderWorkbook(){return ui.wbExercise?wbExerciseScreen(wbCurrent()):ui.wbUnit?wbUnitScreen():wbOverviewScreen();}

function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[«»¿?¡!.,:;()\-\u2014\u2013'“”]/g,' ').replace(/\s+/g,' ').trim();}
function editDistance(a,b){const m=a.length,n=b.length,prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let past=prev[0];prev[0]=i;for(let j=1;j<=n;j++){let old=prev[j];prev[j]=Math.min(prev[j]+1,prev[j-1]+1,past+(a[i-1]===b[j-1]?0:1));past=old;}}return prev[n];}
function answerSimilarity(a,b){let x=norm(a),y=norm(b);if(!x)return 0;if(x===y)return 1;return Math.max(0,1-editDistance(x,y)/Math.max(x.length,y.length));}
function clozeData(s){const stop=new Set(['yo','tu','el','la','lo','los','las','un','una','me','te','se','mi','mis','su','sus','de','del','a','al','en','y','o','por','para','que','es']);const matches=[...s.matchAll(/[\p{L}]+/gu)];const match=matches.find((m,i)=>i<6&&!stop.has(norm(m[0])))||matches[0];if(!match)return {display:s,answer:s};return {display:s.slice(0,match.index)+'_____ '+s.slice(match.index+match[0].length),answer:match[0]};}
function randomSubset(arr,count){const cp=[...arr];for(let i=cp.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cp[i],cp[j]]=[cp[j],cp[i]];}return cp.slice(0,Math.min(count,cp.length));}
function getSessionCards(source, count, opts={}){let items=allCards();if(source==='due')items=items.filter(x=>data.progress[x.id]?.due&&data.progress[x.id].due<=today()).sort((a,b)=>(data.progress[a.id].due||'').localeCompare(data.progress[b.id].due||''));if(source==='unseen')items=items.filter(x=>!data.progress[x.id]?.seen);if(source==='favorites')items=items.filter(x=>fav(x.patternId));if(source==='category')items=items.filter(x=>x.category===(opts.category||ui.practiceCategory));if(source==='custom')items=items.filter(x=>x.category==='Minhas frases');if(source==='pattern')items=items.filter(x=>x.patternId===opts.patternId);return source==='due'?items.slice(0,count):randomSubset(items,count);}
function beginPractice(source=ui.practiceSource,mode=ui.practiceMode,count=ui.practiceCount,opts={}){let cards=getSessionCards(source,count,opts);if(!cards.length){toast(source==='due'?'Sem revisões pendentes. Explore novas estruturas!':'Nenhuma frase disponível nesta seleção.');if(source==='pattern')go('library');return false;}const modes=['translate','cloze','listen','mental'];const queue=cards.map(c=>({...c,mode:mode==='mixed'?modes[Math.floor(Math.random()*modes.length)]:mode,retry:false}));ui.session={queue,index:0,ratings:[],startCount:queue.length,source,mode};ui.checked=false;ui.currentAnswer='';ui.showHint=false;ui.trainingOrigin='practice';ui.page='practice';render();window.scrollTo(0,0);guideShowPage(false);return true;}

function registerGrade(card,grade){const old=data.progress[card.id]||{interval:0,reps:0,ease:2.3,lapses:0};const p={...old};if(grade==='again'){p.reps=0;p.interval=1;p.ease=Math.max(1.4,(p.ease||2.3)-.2);p.lapses=(p.lapses||0)+1;}else if(grade==='hard'){p.interval=Math.max(1,Math.round((p.interval||1)*1.15));p.ease=Math.max(1.4,(p.ease||2.3)-.1);p.reps=(p.reps||0)+1;}else if(grade==='good'){p.interval=p.reps===0?1:p.interval<=1?3:Math.max(p.interval+1,Math.round(p.interval*(p.ease||2.3)));p.reps=(p.reps||0)+1;}else{p.interval=p.reps===0?3:Math.max(4,Math.round(p.interval*(p.ease||2.3)*1.3));p.ease=Math.min(3,(p.ease||2.3)+.12);p.reps=(p.reps||0)+1;}p.seen=true;p.lastGrade=grade;p.last=today();p.due=addDays(today(),p.interval);p.attempts=(p.attempts||0)+1;data.progress[card.id]=p;

let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3300);}
async function copyText(value){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);}else{const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('Cópia não permitida');}toast('Frase copiada.');}catch(e){toast('Não foi possível copiar automaticamente neste navegador.');}}
function speak(es){if(!('speechSynthesis' in window)){toast('Este navegador não oferece leitura de voz.');return;}speechSynthesis.cancel();const utt=new SpeechSynthesisUtterance(es);utt.lang='es-MX';utt.rate=Number(data.voiceSpeed)||.88;const voices=speechSynthesis.getVoices();const spanish=voices.filter(v=>(v.lang||'').toLowerCase().startsWith('es'));const prefer=spanish.find(v=>/^es-(mx|us|co|ar|cl|pe)/i.test(v.lang))||spanish[0];if(prefer)utt.voice=prefer;speechSynthesis.speak(utt);}
let recognizer=null;
function stopListening(){if(recognizer){try{recognizer.stop();}catch(e){}recognizer=null;}ui.listening=false;}
function startListening(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Reconhecimento de voz indisponível. Use Chrome/Edge compatível ou digite.');return;}if(recognizer)stopListening();try{const rec=new SR();rec.lang='es-MX';rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;recognizer=rec;ui.listening=true;toast('Microfone ativo: fale uma frase em espanhol.');rec.onresult=(ev)=>{const value=ev.results[0][0].transcript;const el=document.getElementById(target);if(el){el.value=value;el.focus();}if(target==='userAnswer')ui.currentAnswer=value;if(target==='scenarioAnswer')ui.scenarioAnswer=value;if(target==='verbResponse')ui.verbTyped=value;toast('Fala transcrita. Confira antes de continuar.');};rec.onerror=e=>{const note=e.error==='not-allowed'?'Permissão do microfone negada.':e.error==='network'?'O reconhecimento de voz precisa de um serviço de rede neste navegador.':'Não foi possível captar a fala. Tente digitar.';toast(note);};rec.onend=()=>{ui.listening=false;recognizer=null;};rec.start();}catch(e){toast('Não foi possível ativar o microfone neste navegador.');}}
function downloadBackup(){const blob=new Blob([JSON.stringify({app:'Habla',version:2,createdAt:new Date().toISOString(),data,workbookState:wb,guideState:guidePrefs,labState:JSON.parse(localStorage.getItem('habla.lab.v1')||'null')},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='habla-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup gerado. Guarde o arquivo com segurança.');}
function sanitizeImport(raw){const ob=raw?.data;if(!ob||typeof ob!=='object'||Array.isArray(ob))throw Error('Formato inválido');if(!ob.progress||typeof ob.progress!=='object')throw Error('Backup sem progresso');const customs=Array.isArray(ob.custom)?ob.custom.filter(x=>x&&typeof x.es==='string'&&typeof x.pt==='string'&&typeof x.id==='string').slice(0,1000).map(x=>({id:String(x.id).slice(0,80),es:x.es.slice(0,180),pt:x.pt.slice(0,180),label:'Minha frase'})):[];return {progress:ob.progress||{},favorites:ob.favorites&&typeof ob.favorites==='object'?ob.favorites:{},activity:ob.activity&&typeof ob.activity==='object'?ob.activity:{},scenarioActivity:ob.scenarioActivity&&typeof ob.scenarioActivity==='object'?ob.scenarioActivity:{},custom:customs,dailyGoal:[5,8,10,15,20].includes(Number(ob.dailyGoal))?Number(ob.dailyGoal):8,theme:ob.theme==='dark'?'dark':'light',voiceSpeed:[.7,.88,1].includes(Number(ob.voiceSpeed))?Number(ob.voiceSpeed):.88,verbProgress:ob.verbProgress&&typeof ob.verbProgress==='object'&&!Array.isArray(ob.verbProgress)?ob.verbProgress:{},verbActivity:ob.verbActivity&&typeof ob.verbActivity==='object'&&!Array.isArray(ob.verbActivity)?ob.verbActivity:{},workbookActivity:ob.workbookActivity&&typeof ob.workbookActivity==='object'&&!Array.isArray(ob.workbookActivity)?ob.workbookActivity:{}};}

document.addEventListener('change',e=>{const t=e.target;if(t.dataset.wbId){wbAnswerSave(t);return;}if(t.id==='wbFilter'){ui.wbFilter=t.value;render();return;}
 if(t.id==='verbUnit'){ui.verbUnit=t.value;if(ui.verbChoice!=='all'&&!eligibleVerbs().some(v=>v.lemma===ui.verbChoice))ui.verbChoice='all';ui.verbQuestion=null;ui.verbTranslatedExamples=[];render();return;}

// Recurso pedagógico: hábitos de estudo baseados em sessões efetivamente concluídas.
function dayActivity(date){const a=data.activity?.[date]||{},b=data.verbActivity?.[date]||{},c=data.workbookActivity?.[date]||{},d=data.scenarioActivity?.[date]||{};return {attempts:(a.attempts||0)+(b.attempts||0)+(c.attempts||0)+(d.good||0)+(d.hard||0),good:(a.good||0)+(b.good||0)+(c.good||0)+(d.good||0)};}
function studiedDates(){const days=new Set([...Object.keys(data.activity||{}),...Object.keys(data.verbActivity||{}),...Object.keys(data.workbookActivity||{}),...Object.keys(data.scenarioActivity||{})]);return [...days].filter(d=>/^\d{4}-\d\d-\d\d$/.test(d)&&d<=today()&&dayActivity(d).attempts>0).sort();}
function longestStreak(){const d=studiedDates();let longest=0,current=0,previous='';for(const x of d){current=previous&&addDays(previous,1)===x?current+1:1;longest=Math.max(longest,current);previous=x;}return longest;}
function studiedDays(){return studiedDates().length;}
function renderMiniStreak(){const d=activityLast(7),labels=['D','S','T','Q','Q','S','S'];return `<div class="streak-mini"><div><b>🔥 ${streak()} ${streak()===1?'dia seguido':'dias seguidos'}</b><small>Frequência real · ${studiedDays()} ${studiedDays()===1?'dia ativo':'dias ativos'} no histórico</small></div><div class="week-dots">${d.map((a,i)=>{const day=new Date(a.date+'T12:00:00').getDay(),label=labels[day];return `<div class="week-day ${a.attempts?'active':''} ${a.date===today()?'today':''}"><span>${label}</span><i>${a.attempts?'✓':'·'}</i></div>`}).join('')}</div></div>`;}
function renderCalendar(){const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+ui.calOffset);const first=new Date(base.getFullYear(),base.getMonth(),1);const last=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();const lead=(first.getDay()+6)%7;const cells=[];for(let i=0;i<lead;i++)cells.push('<span class="calendar-date muted"></span>');for(let n=1;n<=last;n++){const date=`${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,count=dayActivity(date).attempts;cells.push(`<span class="calendar-date ${count?'studied':''} ${date===today()?'is-today':''}" title="${date}: ${count} atividade(s) realizadas" aria-label="${date}, ${count} atividades">${n}</span>`);}return `<section class="card streak-calendar-card"><div class="calendar-toolbar"><div><h2>Minha frequência</h2><p class="muted small">${studiedDays()} dias de estudo · melhor sequência: ${longestStreak()} dias</p></div><div class="row"><button class="icon-btn" data-act="calendar-prev" aria-label="Mês anterior">←</button><button class="icon-btn" data-act="calendar-next" aria-label="Próximo mês" ${ui.calOffset>=0?'disabled':''}>→</button></div></div><div style="font-size:12px;font-weight:800;text-transform:capitalize;margin-bottom:8px">${first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div><div class="calendar-grid">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<span class="calendar-weekname">${x}</span>`).join('')}${cells.join('')}</div><div class="calendar-legend"><span><i></i> Estudei</span><span>◯ Dia atual</span><span>Conteúdo concluído, não apenas acesso ao app</span></div></section>`;}

function guideScope(){return ui.page==='workbook'?(ui.wbExercise?'workbook:exercise':ui.wbUnit?'workbook:unit':'workbook'):ui.page==='verbs'&&ui.verbTab==='quiz'?'verbs:quiz':ui.page;}

function guideRoot(){return document.getElementById('guideRoot');}
function guideRemoveHighlight(){document.querySelectorAll('.guide-highlight').forEach(x=>x.classList.remove('guide-highlight'));}
function guideIllustration(art){return `<div class="guide-art"><div class="art-stack">${art.map((x,i)=>`<div class="bubble">${i===0?'💬 ':i===1?'✦ ':'↳ '}${escapeHTML(x)}</div>`).join('')}</div></div>`;}
function guideWelcome(step=0){guideRemoveHighlight();guideFlow={type:'welcome',step};let info=GUIDE_WELCOME[step];guideRoot().innerHTML=`<div class="guide-backdrop"></div><div class="guide-dialog" role="dialog" aria-modal="true" aria-label="Tutorial inicial"><div class="guide-top"><div class="guide-eyebrow">CONHEÇA O HABLA · ${step+1}/${GUIDE_WELCOME.length}</div><button class="guide-close" data-act="guide-welcome-done" aria-label="Pular apresentação">×</button></div>${guideIllustration(info.art)}<h2>${info.title}</h2><p>${info.body}</p><div class="guide-progress">${GUIDE_WELCOME.map((_,i)=>`<span class="${i<=step?'active':''}"></span>`).join('')}</div><div class="guide-controls">${step?`<button class="btn secondary" data-act="guide-welcome-prev">← Voltar</button>`:`<button class="btn secondary" data-act="guide-welcome-done">Pular</button>`}<button class="btn" data-act="${step===GUIDE_WELCOME.length-1?'guide-welcome-done':'guide-welcome-next'}">${step===GUIDE_WELCOME.length-1?'Começar a estudar ✓':'Próximo →'}</button></div></div>`;guideRoot().querySelector('button[data-act="guide-welcome-next"],button[data-act="guide-welcome-done"]')?.focus({preventScroll:true});}
function guideFinishWelcome(){guidePrefs.welcome=true;guideSave();guideFlow=null;guideRoot().innerHTML='';guideShowPage(false);}
function guideShowPage(force=false){if(guideFlow?.type==='welcome')return;const scope=guideScope();if(!force&&guidePrefs.pages?.[scope])return;const steps=GUIDE_PAGES[scope]||GUIDE_PAGES.home;guidePage(scope,0,steps);}
function guidePage(scope,index,steps){guideRemoveHighlight();guideFlow={type:'page',scope,step:index};const info=steps[index],root=guideRoot();root.innerHTML=`<div class="guide-screen" role="dialog" aria-modal="false" aria-label="Ajuda desta tela"><div class="guide-top"><span class="guide-eyebrow">COMO USAR ESTA TELA · ${index+1}/${steps.length}</span><button class="guide-close" data-act="guide-page-done" aria-label="Fechar dica">×</button></div><h2>${info[0]}</h2><p>${info[1]}</p><div class="guide-progress">${steps.map((_,i)=>`<span class="${i<=index?'active':''}"></span>`).join('')}</div><div class="guide-controls"><button class="btn secondary" data-act="guide-page-done">Fechar</button><button class="btn" data-act="guide-page-next">${index===steps.length-1?'Entendi ✓':'Próxima dica →'}</button></div></div>`;
const target=document.querySelector(info[2]);if(target)target.classList.add('guide-highlight');}
function guideEndPage(){const scope=guideFlow?.scope||guideScope();guidePrefs.pages=guidePrefs.pages||{};guidePrefs.pages[scope]=true;guideSave();guideFlow=null;guideRoot().innerHTML='';guideRemoveHighlight();}

function guideAction(act){if(act==='guide-welcome-next'){guideWelcome(Math.min(GUIDE_WELCOME.length-1,guideFlow.step+1));return true;}if(act==='guide-welcome-prev'){guideWelcome(Math.max(0,guideFlow.step-1));return true;}if(act==='guide-welcome-done'){guideFinishWelcome();return true;}if(act==='guide-page-next'){const scope=guideFlow.scope,steps=GUIDE_PAGES[scope]||GUIDE_PAGES.home;if(guideFlow.step+1<steps.length)guidePage(scope,guideFlow.step+1,steps);else guideEndPage();return true;}if(act==='guide-page-done'){guideEndPage();return true;}if(act==='guide-replay'){guideOpenAgain();return true;}if(act==='guide-screen-replay'){guideShowPage(true);return true;}return false;}
